[workspace]
resolver = "3"
members = [
    "aperture",
    "aperture-core",
    "aperture-http",
    "aperture-storage",
]

[workspace.package]
authors = ["Simon Berger <simon@siku2.io>"]
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false
repository = "https://github.com/stargrid-systems/aperture"
rust-version = "1.93"

[workspace.dependencies]
aperture-core = { version = "0.1.0", path = "aperture-core" }
aperture-http = { version = "0.1.0", path = "aperture-http" }
aperture-storage = { version = "0.1.0", path = "aperture-storage" }

anyhow = { version = "1", default-features = false }
astral-tokio-tar = { version = "0.6", default-features = false }
async-compression = { version = "0.4", default-features = false }
axum = { version = "0.8", default-features = false }
clap = { version = "4", default-features = false }
jiff = { version = "0.2", default-features = false }
miette = { version = "7", default-features = false }
oci-client = { version = "0.17", default-features = false }
serde = { version = "1", default-features = false }
serde_json = { version = "1", default-features = false }
thiserror = { version = "2", default-features = false }
tokio = { version = "1", default-features = false }
tower-http = { version = "0.7", default-features = false }
tracing = { version = "0.1", default-features = false }
tracing-subscriber = { version = "0.3", default-features = false }
turso = { version = "0.6", default-features = false }
utoipa = { version = "5", default-features = false }
utoipa-axum = { version = "0.2", default-features = false }

[workspace.lints.clippy]
absolute_paths = "warn"
