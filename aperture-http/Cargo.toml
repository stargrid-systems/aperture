[package]
name = "aperture-http"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
aperture-artifacts = { workspace = true }
aperture-auth = { workspace = true }
aperture-runtime = { workspace = true }
aperture-settings = { workspace = true }
aperture-storage = { workspace = true }
aperture-tasks = { workspace = true }

anyhow = { workspace = true, features = ["std"] }
arc-swap = { workspace = true }
axum = { workspace = true, features = ["json", "query", "tokio", "http1"] }
backhand = { workspace = true, features = ["gzip", "zstd"] }
bytes = { workspace = true }
cookie = { workspace = true, features = ["percent-encode"] }
futures-util = { workspace = true }
http-body-util = { workspace = true }
httpdate = { workspace = true }
jiff = { workspace = true, features = ["std", "serde"] }
mime_guess = { workspace = true }
percent-encoding = { workspace = true }
rcgen = { workspace = true, features = ["ring", "x509-parser"] }
rustls = { workspace = true, features = ["ring", "std", "tls12"] }
serde = { workspace = true, features = ["std", "derive"] }
serde_json = { workspace = true, features = ["std"] }
thiserror = { workspace = true, features = ["std"] }
time = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["macros", "rt", "net", "sync", "time", "fs"] }
tokio-rustls = { workspace = true, features = ["ring", "tls12"] }
tokio-stream = { workspace = true }
tokio-util = { workspace = true, features = ["io", "rt"] }
tower-http = { workspace = true, features = ["trace", "limit"] }
tracing = { workspace = true }
utoipa = { workspace = true, features = ["macros", "axum_extras", "jiff_0_2", "uuid"] }
utoipa-axum = { workspace = true }
uuid = { workspace = true, features = ["std", "serde"] }
x509-parser = { workspace = true }

[dev-dependencies]
aperture-artifacts = { workspace = true }
aperture-auth = { workspace = true }
jiff = { workspace = true, features = ["std"] }
serde_json = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["full"] }
tower = { workspace = true, features = ["util"] }
