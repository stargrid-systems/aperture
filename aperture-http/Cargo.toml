[package]
name = "aperture-http"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
aperture-artifacts = { workspace = true }
aperture-storage = { workspace = true }
aperture-tasks = { workspace = true }

anyhow = { workspace = true, features = ["std"] }
axum = { workspace = true, features = ["json", "query"] }
backhand = { workspace = true, features = ["gzip", "zstd"] }
bytes = { workspace = true }
jiff = { workspace = true, features = ["std", "serde"] }
mime_guess = { workspace = true }
serde = { workspace = true, features = ["std", "derive"] }
serde_json = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["rt", "sync", "time"] }
tokio-stream = { workspace = true }
tower-http = { workspace = true, features = ["trace"] }
tracing = { workspace = true }
utoipa = { workspace = true, features = ["macros", "axum_extras", "jiff_0_2", "uuid"] }
utoipa-axum = { workspace = true }
uuid = { workspace = true, features = ["std", "serde"] }

[dev-dependencies]
aperture-artifacts = { workspace = true }
jiff = { workspace = true, features = ["std"] }
serde_json = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["full"] }
tower = { workspace = true, features = ["util"] }
