[package]
name = "aperture-http"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
aperture-artifacts = { workspace = true }
aperture-core = { workspace = true }
anyhow = { workspace = true, features = ["std"] }
axum = { workspace = true, features = ["json", "query"] }
backhand = { workspace = true, features = ["gzip", "zstd"] }
bytes = { workspace = true }
jiff = { workspace = true, features = ["std", "serde"] }
mime_guess = { workspace = true }
serde = { workspace = true, features = ["std", "derive"] }
tokio = { workspace = true, features = ["rt", "sync", "time"] }
tokio-stream = { workspace = true }
tracing = { workspace = true }
# The `uuid` feature is enabled to work around a utoipa 5.5.0 bug where the
# `jiff_0_2` schema detection only compiles when another such feature is on.
utoipa = { workspace = true, features = ["macros", "axum_extras", "jiff_0_2", "uuid"] }
utoipa-axum = { workspace = true }

[dev-dependencies]
aperture-artifacts = { workspace = true }
aperture-core = { workspace = true }
jiff = { workspace = true, features = ["std"] }
serde_json = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["full"] }
tower = { workspace = true, features = ["util"] }
