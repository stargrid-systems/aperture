<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="refresh" content="2" />
    <title>Setting up</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        display: grid;
        place-items: center;
        min-height: 100vh;
        margin: 0;
        background: #0b0d12;
        color: #e6e9ef;
      }
      .box {
        text-align: center;
      }
      .spinner {
        width: 28px;
        height: 28px;
        margin: 0 auto 16px;
        border: 3px solid #2a2f3a;
        border-top-color: #6ea8fe;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="box">
      <div class="spinner"></div>
      <p>Installing the interface. This page will refresh on its own.</p>
    </div>
  </body>
</html>
