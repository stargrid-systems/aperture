[package]
name = "aperture-os"
version.workspace = true
description = "OS integration for Aperture: mDNS service publication and hostname management."
authors.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
aperture-runtime = { workspace = true }
aperture-settings = { workspace = true }
aperture-storage = { workspace = true }
aperture-tasks = { workspace = true }
anyhow = { workspace = true, features = ["std"] }
serde = { workspace = true, features = ["std", "derive"] }
thiserror = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["sync"] }
tracing = { workspace = true, features = ["std", "attributes"] }
utoipa = { workspace = true, features = ["macros"] }
zbus = { workspace = true, features = ["tokio"] }
