[package]
name = "aperture"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
aperture-artifacts = { workspace = true }
aperture-http = { workspace = true }
aperture-storage = { workspace = true }
aperture-tasks = { workspace = true }
arc-swap = { workspace = true }
axum = { workspace = true, features = ["tokio", "http1"] }
clap = { workspace = true, features = ["std", "derive", "env", "help", "usage", "error-context", "suggestions"] }
jiff = { workspace = true, features = ["std"] }
miette = { workspace = true }
rcgen = { workspace = true, features = ["pem", "ring", "x509-parser"] }
rustls = { workspace = true, features = ["ring", "std", "tls12"] }
rustls-pemfile = { workspace = true, features = ["std"] }
serde = { workspace = true, features = ["std"] }
serde_json = { workspace = true, features = ["std"] }
thiserror = { workspace = true, features = ["std"] }
time = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "fs", "sync", "time", "signal"] }
tokio-rustls = { workspace = true, features = ["ring", "tls12"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["fmt", "env-filter", "ansi", "tracing-log"] }
uuid = { workspace = true, features = ["std", "v4"] }
x509-parser = { workspace = true }
