[package]
name = "aperture"
version = "0.1.0"
authors.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
aperture-artifacts = { workspace = true }
aperture-http = { workspace = true }
aperture-tasks = { workspace = true }
axum = { workspace = true, features = ["tokio", "http1"] }
clap = { workspace = true, features = ["std", "derive", "env", "help", "usage", "error-context", "suggestions"] }
miette = { workspace = true }
serde_json = { workspace = true, features = ["std"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "fs"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["fmt", "env-filter", "ansi"] }
