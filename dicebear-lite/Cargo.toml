[package]
name = "dicebear-lite"
version = "0.1.0"
description = "Slim, byte-compatible DiceBear avatar renderer."
authors.workspace = true
edition.workspace = true
license.workspace = true
publish = false
repository.workspace = true
rust-version.workspace = true

[features]
# Enables the "constellation" style (DiceBear 10.x, CC0 1.0).
constellation = []
# Enables the "planets" style (DiceBear 10.x, CC0 1.0).
planets = []
# Enables the "thumbs" style (DiceBear 10.x, CC0 1.0).
thumbs = []

[[test]]
name = "parity"
required-features = ["constellation", "planets", "thumbs"]

[dev-dependencies]
# Byte-parity oracle: the upstream renderer, exercised against the upstream
# style data. Exact pins: parity against a moving target is meaningless.
dicebear-core = "=10.5.0"
dicebear-styles = { version = "=10.6.0", features = ["constellation", "planets", "thumbs"] }
serde_json = "=1.0.151"

[lints]
workspace = true
